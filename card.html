<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Fiber — Get in Touch</title>
<meta name="description" content="Executive Fiber — fiber internet across the County. Contact us or visit the full site.">
<style>
  :root{
    --navy:#0B1E35;
    --navy-deep:#081526;
    --panel:#102542;
    --line:#1E3A5F;
    --cyan:#3FD8E0;
    --blue:#4C8DFF;
    --text:#EAF2FB;
    --muted:#8FA6C2;
    --display:'Fraunces', Georgia, serif;
    --body:'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    --mono:'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(79,141,255,0.16), transparent 55%),
      radial-gradient(circle at 85% 100%, rgba(63,216,224,0.12), transparent 55%),
      var(--navy);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    line-height:1.55;
  }
  .card{
    width:100%; max-width:420px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 30px 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--cyan), var(--blue));
  }
  .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:50%;
    background:var(--navy-deep); border:1px solid var(--line);
    margin-bottom:18px;
  }
  .mark svg{width:26px; height:26px;}
  h1{
    font-family:var(--display); font-weight:600; font-size:28px;
    letter-spacing:-0.01em; margin-bottom:6px;
  }
  .tagline{
    font-family:var(--mono); font-size:12px; color:var(--cyan);
    letter-spacing:0.03em; margin-bottom:22px;
  }
  .desc{color:var(--muted); font-size:14.5px; max-width:32ch; margin:0 auto 28px;}

  .actions{display:flex; flex-direction:column; gap:12px; margin-bottom:26px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 18px; border-radius:10px; font-size:15px; font-weight:600;
    text-decoration:none; transition:transform .15s, opacity .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-whatsapp{background:#25D366; color:#06210F;}
  .btn-call{background:var(--navy-deep); color:var(--text); border:1px solid var(--line);}
  .btn-site{background:transparent; color:var(--cyan); border:1px solid var(--line);}
  .btn svg{width:18px; height:18px; flex-shrink:0;}

  .meta{
    display:flex; justify-content:center; gap:18px; flex-wrap:wrap;
    font-family:var(--mono); font-size:11.5px; color:var(--muted);
    padding-top:18px; border-top:1px solid var(--line);
  }

  .footer-link{
    margin-top:22px; font-size:12px; color:var(--muted);
  }
  .footer-link a{color:var(--muted); text-decoration:underline; text-underline-offset:2px;}
  .footer-link a:hover{color:var(--cyan);}
</style>
</head>
<body>

  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round">
        <path d="M2 8.5a15 15 0 0 1 20 0"/>
        <path d="M5.5 12a10 10 0 0 1 13 0"/>
        <path d="M9 15.5a5 5 0 0 1 6 0"/>
        <circle cx="12" cy="19" r="1.2" fill="var(--cyan)" stroke="none"/>
      </svg>
    </div>

    <h1>Executive Fiber</h1>
    <div class="tagline">Fiber internet · Across the County</div>
    <p class="desc">Reliable home and business fiber connections, with local support when you need it.</p>

    <div class="actions">
      <a class="btn btn-whatsapp" href="https://wa.me/254797150692" target="_blank" rel="noopener">

      </a>
      <a class="btn btn-call" href="tel:+254115569478">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>

        Visit full website &amp; packages

    </div>

    <div class="meta">
      <span>Home &amp; Business Fiber</span>
    </div>

    <div class="footer-link">
      Network &amp; site by <a href="index.html">Ian Nalwari</a>
    </div>
  </div>

</body>
</html>
